# AI Agent Platform — Docker Compose 部署
# 原生进程 (uvicorn on 8099) 的容器化替代。
# 用法（TASK-015 双后端，纯 .env 切换 DB_BACKEND，业务代码零感知）:
#
#  默认 = SQLite（零外部依赖，clone 即跑）：
#     docker compose up -d --build
#   数据文件 /app/data/agp.db 经 named volume agpdata 持久化（宿主物理位置用
#   `docker volume inspect agp_agpdata` 查看，通常为 /var/lib/docker/volumes/agp_agpdata/_data）。
#   首次启动自动建表 src/core/schema_sqlite.sql + 种子，重启/重建容器数据仍在。
#   无需 chown 宿主目录（named volume 由 Docker 管理属主，容器内 uid 1000 可直接写）。
#   不需要任何外部网络/容器。
#
#  可选 = PostgreSQL（DB_BACKEND=postgres，.env 填 AGP_DB_PASSWORD 等）：
#     sg docker -c 'docker network inspect agp_default >/dev/null 2>&1 \
#       || docker network create agp_default'     # 首次需建外部网络
#     docker compose -f docker-compose.yml -f docker-compose.pg.yml up -d --build
#   需要宿主已有 pg-unified 容器（postgres-unified 项目）且与 app 同在 agp_default 网络。
#
#  密钥纪律（DECISION-004）：全部密钥（含 AGP_DB_PASSWORD）从 ./src/.env 注入
#  （env_file，运行时注入、不进镜像——.dockerignore 排除 .env）。
#  连接参数默认值在 src/core/config.py。
#
#  TASK-037 Hermes 后端（可选）：
#     挂载宿主 ~/.hermes → 容器 /home/hermes/.hermes（HERMES_HOME 卷，含
#     hermes-agent venv + profiles + .env 密钥）+ 宿主 ~/.local/share/uv →
#     容器同路径（venv python 符号链接目标）。挂载后容器内 hermes CLI 可用；
#     未挂载（如纯 sqlite 部署）→ /api/hermes/* 返回 503，custom 不受影响。
#  ⚠ 风险（PM 已决策接受，单机组件部署）：挂载后容器可读写宿主全部 hermes
#    profile 数据（含会话/记忆/密钥引用）。见 DEV_REPORT §TASK-037 风险章节。
#  ⚠ .env 不进镜像：宿主 ~/.hermes/.env 经 bind-mount 运行时可见，
#    镜像层无密钥；宿主卷权限 600 限制。

name: agp

services:
  app:
    build:
      context: ./src
      dockerfile: Dockerfile
    image: agp-platform:1.6.0
    container_name: agp-app
    restart: unless-stopped
    env_file:
      - ./src/.env
    environment:
      TZ: Asia/Shanghai
      # 容器内代码在 /app（Dockerfile WORKDIR），数据卷挂 /app/data：
      # 显式指定数据文件绝对路径（相对路径会按容器 cwd 解析，固定为 /app/data/agp.db）。
      # PG 模式下该值无效（DB_BACKEND=postgres 时不读 sqlite 文件）。
      SQLITE_PATH: /app/data/agp.db
      # TASK-037: HERMES_HOME 指向挂载的宿主 hermes 目录
      HERMES_HOME: /home/hermes/.hermes
    ports:
      - "8099:8099"
    volumes:
      # 持久化 agp.db（sqlite 模式：named volume agpdata，重启/重建不丢）。
      # 用 named volume 而非 bind 卷，避免"宿主目录属主非 1000 → 容器内 uid 1000
      # 不可写 → sqlite fail-fast"的坑（1.5.0 实测）。Docker 在首次挂载时把镜像内
      # /app/data（已 chown 1000，见 Dockerfile）复制进卷，属主自动正确。
      # 若需显式 bind 卷（外部 -f override 覆盖回 ./src/data:/app/data），行为不变：
      # bind 卷用户自己负责宿主目录属主（见 README 升级路径 / chown 提示）。
      - agpdata:/app/data
      # 从旧 bind 卷（./src/data/agp.db）升级：见 README「从 bind 卷迁移到 named volume」，
      # 一条命令把旧库拷进本卷（**必须 chown 1000**：alpine cp 以 root 运行，不 chown 则
      # agp.db 属 root → 容器 uid 1000 不可写 → fail-fast，实测）：
      #   docker run --rm -v agp_agpdata:/data -v $(pwd)/src/data:/old:ro alpine sh -c 'cp /old/agp.db /data/ && chown -R 1000:1000 /data'
      # TASK-037: Hermes 运行时（hermes-agent venv + profiles + .env）。
      # 宿主目录不存在时 docker 会创建空目录 → hermes_available()=False → 503，
      # 优雅降级不影响 custom agent（AC-H7 双模式兼容）。
      - /home/hermes/.hermes:/home/hermes/.hermes
      # venv 的 python 是符号链接，指向 uv 管理的 CPython（见 pyvenv.cfg）
      - /home/hermes/.local/share/uv:/home/hermes/.local/share/uv
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8099/healthz', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # 网络说明：sqlite 模式不需要任何外部网络（app 自动获得 compose 内部网络）。
    # PG 模式的外部网络 agp_default 由 docker-compose.pg.yml 叠加声明。

# ---- 命名卷（T-AGP-NAMEDVOL）----
# agpdata：sqlite 数据（agp.db）持久化。compose 项目名 = agp（见上方 name:），
# 故本卷全名 = agp_agpdata，宿主位置 `docker volume inspect agp_agpdata`。
# 相比 bind 卷（./src/data:/app/data）：无需每台机器 chown 宿主目录，属主由
# Docker 管理（首次挂载把镜像内已 chown 1000 的 /app/data 复制进卷）。
# 显式 bind 卷用户（外部 -f override 覆盖）不受影响，属主自理（见 README）。
volumes:
  agpdata:
